[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Event-driven orchestrator for autonomous AI software workflows"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
pedantic = "warn"

[profile.release]
# One binary that runs for weeks: spend build time once, not runtime.
lto = "fat"
codegen-units = 1

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
